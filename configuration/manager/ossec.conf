<ossec_config>

  <!--
  ========================================================================
  ORANGEBOX WAZUH - CONFIGURACION PRINCIPAL
  ========================================================================

  Este archivo contiene la configuracion global del Wazuh Manager.

  Las reglas personalizadas NO se mantienen aqui.
  Se encuentran separadas en:

      /var/ossec/etc/rules/

  La configuracion de agentes se mantiene en:

      /var/ossec/etc/shared/

  Objetivo general:

      DETECTAR
          |
          +-- Autenticacion
          +-- Ataques de red
          +-- Ataques Web
          +-- Persistencia
          +-- Malware
          +-- Rootkits
          +-- Cambios criticos
          +-- Vulnerabilidades
          +-- Evasion de defensas
          |
          v
      CORRELACION
          |
          v
      ALERTA
          |
          +-- Email HTML
          |
          v
      ACTIVE RESPONSE
          |
          +-- Bloqueo IP
          +-- Contencion
          +-- Otras acciones

  IMPORTANTE:

  El correo nativo de Wazuh queda practicamente deshabilitado mediante
  email_alert_level alto.

  El envio de correo de seguridad se realiza mediante:

      custom-orangebox-email.py

  ========================================================================
  -->


  <!--
  ========================================================================
  1. CONFIGURACION GLOBAL
  ========================================================================
  -->

  <global>

    <!--
    Genera alerts.json.
    Es importante porque nuestra integracion de correo utiliza JSON.
    -->
    <jsonout_output>yes</jsonout_output>

    <!--
    Mantener alerts.log habilitado.
    Es utilizado por varias herramientas de diagnostico y por integraciones.
    -->
    <alerts_log>yes</alerts_log>

    <!--
    No guardar absolutamente todos los eventos recibidos.
    Evitamos convertir el manager en una aspiradora de logs.
    <logall_json>no</logall_json>
    -->
    <logall>no</logall>
    <logall_json>no</logall_json>


    <!--
    --------------------------------------------------------------------
    EMAIL NATIVO DE WAZUH
    --------------------------------------------------------------------

    El correo principal de OrangeBox se envia mediante la integracion
    personalizada custom-orangebox-email.py.

    Dejamos el umbral nativo alto para evitar correos duplicados.
    --------------------------------------------------------------------
    -->

    <email_notification>yes</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@orangebox.cl</email_from>
    <email_to>soporte@orangebox.cl</email_to>

    <!--
    Limite del mecanismo de correo nativo.
    Las alertas normales se procesan mediante la integracion personalizada.
    -->
    <email_maxperhour>12</email_maxperhour>

    <email_log_source>alerts.log</email_log_source>


    <!--
    --------------------------------------------------------------------
    DETECCION DE AGENTES DESCONECTADOS
    --------------------------------------------------------------------

    Si un agente desaparece durante mas de 10 minutos se considera
    desconectado.

    agents_disconnection_alert_time=0 hace que el evento sea alertado
    inmediatamente cuando se alcanza el tiempo configurado.
    --------------------------------------------------------------------
    -->

    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>


    <!--
    Permite que el manager compruebe si existe una nueva version/feed.
    -->
    <update_check>yes</update_check>


    <!--
    --------------------------------------------------------------------
    WHITELIST GLOBAL
    --------------------------------------------------------------------

    Estas IP no deberian generar determinadas detecciones de tipo
    "origen confiable".

    IMPORTANTE:
    La whitelist global NO significa "ignorar absolutamente todo lo que
    haga esta IP". Las reglas pueden aplicar sus propias excepciones.

    Aqui dejamos solamente infraestructura que sabemos que es confiable.
    --------------------------------------------------------------------
    -->

    <white_list>127.0.0.1</white_list>

    <!-- Proxy reverso -->
    <white_list>192.168.200.7</white_list>
    <white_list>192.168.200.13</white_list>

    <!-- Zabbix -->
    <white_list>192.168.200.240</white_list>

    <!-- BackupPC -->
    <white_list>192.168.200.1</white_list>

    <!-- Wazuh -->
    <white_list>192.168.200.160</white_list>
  </global>


  <!--
  ========================================================================
  2. NIVELES DE ALERTA
  ========================================================================

  log_alert_level:

      Desde nivel 3 se registra la alerta normalmente.

  email_alert_level:

      Lo dejamos en 16 para que el mecanismo de correo NATIVO no envie
      nuestras reglas personalizadas de nivel 12/13.

  Las notificaciones reales se realizan mediante:

      custom-orangebox-email.py

  que se configura mas abajo.

  ========================================================================
  -->

  <alerts>

    <log_alert_level>3</log_alert_level>

    <!--
    Evita que el correo nativo de Wazuh duplique las alertas HTML.
    -->
    <email_alert_level>16</email_alert_level>

  </alerts>


  <!--
  ========================================================================
  3. LOG DEL MANAGER
  ========================================================================
  -->

  <logging>

    <!-- Formato tradicional para ossec.log. -->
    <log_format>plain</log_format>

  </logging>


  <!--
  ========================================================================
  4. RECEPCION DE AGENTES
  ========================================================================

  Los agentes se conectan al manager utilizando TCP/1514.

  TCP es preferible aqui frente a UDP cuando queremos priorizar
  confiabilidad de entrega.
  ========================================================================
  -->

  <remote>

    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>

    <!-- Cola suficientemente grande para absorber rafagas de eventos. -->
    <queue_size>131072</queue_size>

  </remote>


  <!--
  ========================================================================
  5. ROOTCHECK
  ========================================================================

  Rootcheck busca indicios de:

      - Rootkits
      - Archivos sospechosos
      - Puertos ocultos
      - Procesos anormales
      - Cambios sospechosos del sistema

  No es nuestro unico mecanismo de deteccion de malware.
  FIM + Audit + reglas + vulnerability detection trabajan en conjunto.
  ========================================================================
  -->

  <rootcheck>

    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <!-- Dos analisis diarios. -->
    <frequency>43200</frequency>

    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>

    <!-- Evita recorrer NFS, donde Rootcheck puede generar mucho ruido. -->
    <skip_nfs>yes</skip_nfs>

    <!-- Directorios conocidos por contener grandes cantidades de archivos administrados dinamicamente. -->
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>

  </rootcheck>


  <!--
  ========================================================================
  6. CIS-CAT
  ========================================================================
  -->

  <wodle name="cis-cat">

    <!-- Deshabilitado actualmente. SCA proporciona la evaluacion de configuracion de seguridad. -->
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>
    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>

  </wodle>


  <!--
  ========================================================================
  7. OSQUERY
  ========================================================================
  -->

  <wodle name="osquery">

    <!-- Deshabilitado actualmente. Se puede activar posteriormente si necesitamos consultas especificas. -->
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>

  </wodle>


  <!--
  ========================================================================
  8. SYSCOLLECTOR
  ========================================================================

  Inventario de hardware, sistema operativo, interfaces, paquetes,
  puertos y procesos.
  ========================================================================
  -->

  <wodle name="syscollector">

    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>

    <synchronization>
      <!-- Limita el ritmo de sincronizacion para evitar picos innecesarios. -->
      <max_eps>10</max_eps>
    </synchronization>

  </wodle>


  <!--
  ========================================================================
  9. SCA - SECURITY CONFIGURATION ASSESSMENT
  ========================================================================
  -->

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>


  <!--
  ========================================================================
  10. VULNERABILITY DETECTION
  ========================================================================
  -->

  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <!-- Actualizacion del feed cada hora. -->
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>


  <!--
  ========================================================================
  11. INDEXER
  ========================================================================
  -->

  <indexer>

    <enabled>yes</enabled>

    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>

    <ssl>
      <certificate_authorities>
        <ca>/etc/filebeat/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/filebeat/certs/wazuh-server.pem</certificate>
      <key>/etc/filebeat/certs/wazuh-server-key.pem</key>
    </ssl>

  </indexer>


  <!--
  ========================================================================
  12. FILE INTEGRITY MONITORING - FIM
  ========================================================================

  El FIM general y las rutas especificas de agentes se configuran
  principalmente mediante:

      /var/ossec/etc/shared/*/agent.conf

  Aqui mantenemos solamente el comportamiento global.

  Las reglas personalizadas interpretan los eventos producidos por FIM.
  ========================================================================
  -->

  <syscheck>

    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- Generar alertas cuando aparezcan archivos nuevos en rutas vigiladas. -->
    <alert_new_files>yes</alert_new_files>

    <!-- No ignorar automaticamente modificaciones repetitivas. -->
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Exclusiones de archivos dinamicos del sistema. -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <!-- No generar eventos por archivos de log ni swap de editores. -->
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Nunca enviar diferencias de este archivo. Puede contener material altamente sensible. -->
    <nodiff>/etc/ssl/private.key</nodiff>

    <!-- Evitar recorrer pseudo-filesystems. -->
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>

    <!-- 10 = menor prioridad que procesos normales. -->
    <process_priority>10</process_priority>

    <!-- Limite global de eventos generados por FIM. -->
    <max_eps>50</max_eps>

    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>

  </syscheck>


  <!--
  ========================================================================
  13. ACTIVE RESPONSE - COMANDOS NATIVOS
  ========================================================================
  -->

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <command>
    <name>win_route-null</name>
    <executable>route-null.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>

  <command>
    <name>netsh</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
    <expect>srcip</expect>
  </command>


  <!--
  ========================================================================
  14. ACTIVE RESPONSE - SSH BRUTE FORCE
  ========================================================================
  -->

  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5720</rules_id>
    <timeout>180</timeout>
  </active-response>


  <!--
  ========================================================================
  15. ACTIVE RESPONSE - SSH BRUTE FORCE EXITOSO
  ========================================================================
  -->

  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10006</rules_id>
    <timeout>86400</timeout>
  </active-response>


  <!--
  ========================================================================
  16. ACTIVE RESPONSE - FUERZA BRUTA WEB
  ========================================================================
  -->

  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>10025</rules_id>
    <timeout>180</timeout>
  </active-response>


  <!--
  ========================================================================
  17. LOCALFILE - LOGS DE AUTENTICACION
  ========================================================================
  -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>


  <!--
  ========================================================================
  18. LOCALFILE - AUDITD
  ========================================================================

  Esta configuracion permite que Wazuh reciba los eventos generados por
  Linux Auditd.

  Auditd aporta contexto de comportamiento que FIM por si solo no entrega:

      - proceso
      - usuario
      - PID
      - syscall
      - archivo afectado
      - operacion realizada

  La nueva arquitectura de deteccion de malware utilizara estos eventos
  para correlacionar actividad sospechosa antes de generar una alerta.
  ========================================================================
  -->

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>


  <!--
  ========================================================================
  19. ACTIVE RESPONSE LOG
  ========================================================================
  -->

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>


  <!--
  ========================================================================
  20. SURICATA
  ========================================================================

  Si el agente/manager dispone de Suricata y genera eve.json, Wazuh puede
  consumir sus eventos.
  ========================================================================
  -->

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>


  <!--
  ========================================================================
  21. EMAIL HTML ORANGEBOX
  ========================================================================

  Esta es la ruta principal de envio de alertas de seguridad.

  Nivel 12 significa:

      Cualquier alerta personalizada de nivel 12 o superior.

  ========================================================================
  -->

  <integration>
    <name>custom-orangebox-email.py</name>
    <hook_url>soporte@orangebox.cl</hook_url>
    <level>12</level>
    <alert_format>json</alert_format>
  </integration>


</ossec_config>
