<ossec_config>

  <!--
  ========================================================================
  ORANGEBOX WAZUH - CONFIGURACION PRINCIPAL
  ========================================================================

  Este archivo contiene la configuracion global del Wazuh Manager.

  Las reglas personalizadas NO se mantienen aqui.
  Se encuentran separadas en:

      /var/ossec/etc/rules/

  La configuracion de agentes se mantiene en:

      /var/ossec/etc/shared/

  Objetivo general:

      DETECTAR
          |
          +-- Autenticacion
          +-- Ataques de red
          +-- Ataques Web
          +-- Persistencia
          +-- Malware
          +-- Rootkits
          +-- Cambios criticos
          +-- Vulnerabilidades
          +-- Evasion de defensas
          |
          v
      CORRELACION
          |
          v
      ALERTA
          |
          +-- Email HTML
          |
          v
      ACTIVE RESPONSE
          |
          +-- Bloqueo IP
          +-- Contencion
          +-- Otras acciones

  IMPORTANTE:

  El correo nativo de Wazuh queda practicamente deshabilitado mediante
  email_alert_level alto.

  El envio de correo de seguridad se realiza mediante:

      custom-orangebox-email.py

  ========================================================================
  -->


  <!--
  ========================================================================
  1. CONFIGURACION GLOBAL
  ========================================================================
  -->

  <global>

    <!--
    Genera alerts.json.
    Es importante porque nuestra integracion de correo utiliza JSON.
    -->
    <jsonout_output>yes</jsonout_output>

    <!--
    Mantener alerts.log habilitado.
    Es utilizado por varias herramientas de diagnostico y por integraciones.
    -->
    <alerts_log>yes</alerts_log>

    <!--
    No guardar absolutamente todos los eventos recibidos.
    Evitamos convertir el manager en una aspiradora de logs.
    <logall_json>no</logall_json>
    -->
    <logall>no</logall>
    <logall_json>no</logall_json>


    <!--
    --------------------------------------------------------------------
    EMAIL NATIVO DE WAZUH
    --------------------------------------------------------------------

    El correo principal de OrangeBox se envia mediante la integracion
    personalizada custom-orangebox-email.py.

    Dejamos el umbral nativo alto para evitar correos duplicados.
    --------------------------------------------------------------------
    -->

    <email_notification>yes</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@orangebox.cl</email_from>
    <email_to>soporte@orangebox.cl</email_to>

    <!--
    Limite del mecanismo de correo nativo.
    Las alertas normales se procesan mediante la integracion personalizada.
    -->
    <email_maxperhour>12</email_maxperhour>

    <email_log_source>alerts.log</email_log_source>


    <!--
    --------------------------------------------------------------------
    DETECCION DE AGENTES DESCONECTADOS
    --------------------------------------------------------------------

    Si un agente desaparece durante mas de 10 minutos se considera
    desconectado.

    agents_disconnection_alert_time=0 hace que el evento sea alertado
    inmediatamente cuando se alcanza el tiempo configurado.
    --------------------------------------------------------------------
    -->

    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>


    <!--
    Permite que el manager compruebe si existe una nueva version/feed.
    -->
    <update_check>yes</update_check>


    <!--
    --------------------------------------------------------------------
    WHITELIST GLOBAL
    --------------------------------------------------------------------

    Estas IP no deberian generar determinadas detecciones de tipo
    "origen confiable".

    IMPORTANTE:
    La whitelist global NO significa "ignorar absolutamente todo lo que
    haga esta IP". Las reglas pueden aplicar sus propias excepciones.

    Aqui dejamos solamente infraestructura que sabemos que es confiable.
    --------------------------------------------------------------------
    -->

    <white_list>127.0.0.1</white_list>

    <!-- Proxy reverso -->
    <white_list>192.168.200.7</white_list>
    <white_list>192.168.200.13</white_list>

    <!-- Zabbix -->
    <white_list>192.168.200.240</white_list>

    <!-- BackupPC -->
    <white_list>192.168.200.1</white_list>

    <!-- Wazuh -->
    <white_list>192.168.200.160</white_list>
  </global>


  <!--
  ========================================================================
  2. NIVELES DE ALERTA
  ========================================================================

  log_alert_level:

      Desde nivel 3 se registra la alerta normalmente.

  email_alert_level:

      Lo dejamos en 16 para que el mecanismo de correo NATIVO no envie
      nuestras reglas personalizadas de nivel 12/13.

  Las notificaciones reales se realizan mediante:

      custom-orangebox-email.py

  que se configura mas abajo.

  ========================================================================
  -->

  <alerts>

    <log_alert_level>3</log_alert_level>

    <!--
    Evita que el correo nativo de Wazuh duplique las alertas HTML.
    -->
    <email_alert_level>16</email_alert_level>

  </alerts>


  <!--
  ========================================================================
  3. LOG DEL MANAGER
  ========================================================================
  -->

  <logging>

    <!--
    Formato tradicional para ossec.log.
    -->
    <log_format>plain</log_format>

  </logging>


  <!--
  ========================================================================
  4. RECEPCION DE AGENTES
  ========================================================================

  Los agentes se conectan al manager utilizando TCP/1514.

  TCP es preferible aqui frente a UDP cuando queremos priorizar
  confiabilidad de entrega.
  ========================================================================
  -->

  <remote>

    <connection>secure</connection>

    <port>1514</port>

    <protocol>tcp</protocol>

    <!--
    Cola suficientemente grande para absorber rafagas de eventos.
    -->
    <queue_size>131072</queue_size>

  </remote>


  <!--
  ========================================================================
  5. ROOTCHECK
  ========================================================================

  Rootcheck busca indicios de:

      - Rootkits
      - Archivos sospechosos
      - Puertos ocultos
      - Procesos anormales
      - Cambios sospechosos del sistema

  No es nuestro unico mecanismo de deteccion de malware.
  FIM + Audit + reglas + vulnerability detection trabajan en conjunto.
  ========================================================================
  -->

  <rootcheck>

    <disabled>no</disabled>

    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <!--
    Dos analisis diarios.
    -->
    <frequency>43200</frequency>

    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>

    <!--
    Evita recorrer NFS, donde Rootcheck puede generar mucho ruido.
    -->
    <skip_nfs>yes</skip_nfs>

    <!--
    Directorios conocidos por contener grandes cantidades de archivos
    administrados dinamicamente.
    -->
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>

  </rootcheck>


  <!--
  ========================================================================
  6. CIS-CAT
  ========================================================================
  -->

  <wodle name="cis-cat">

    <!--
    Deshabilitado actualmente.
    SCA proporciona la evaluacion de configuracion de seguridad.
    -->
    <disabled>yes</disabled>

    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>

    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>

  </wodle>


  <!--
  ========================================================================
  7. OSQUERY
  ========================================================================
  -->

  <wodle name="osquery">

    <!--
    Deshabilitado actualmente.
    Se puede activar posteriormente si necesitamos consultas especificas
    de inventario/endpoint.
    -->
    <disabled>yes</disabled>

    <run_daemon>yes</run_daemon>

    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>

    <add_labels>yes</add_labels>

  </wodle>


  <!--
  ========================================================================
  8. SYSCOLLECTOR
  ========================================================================

  Inventario de:

      - Hardware
      - Sistema operativo
      - Interfaces
      - Paquetes
      - Puertos
      - Procesos

  Tambien alimenta parte de la informacion utilizada por deteccion
  de vulnerabilidades.
  ========================================================================
  -->

  <wodle name="syscollector">

    <disabled>no</disabled>

    <interval>1h</interval>

    <scan_on_start>yes</scan_on_start>

    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>

    <ports all="no">yes</ports>

    <processes>yes</processes>

    <synchronization>

      <!--
      Limita el ritmo de sincronizacion para evitar picos innecesarios.
      -->
      <max_eps>10</max_eps>

    </synchronization>

  </wodle>


  <!--
  ========================================================================
  9. SCA - SECURITY CONFIGURATION ASSESSMENT
  ========================================================================
  -->

  <sca>

    <enabled>yes</enabled>

    <scan_on_start>yes</scan_on_start>

    <interval>12h</interval>

    <skip_nfs>yes</skip_nfs>

  </sca>


  <!--
  ========================================================================
  10. VULNERABILITY DETECTION
  ========================================================================

  Wazuh utiliza el inventario de software de los agentes para detectar
  vulnerabilidades conocidas.

  Nuestro ruleset personalizado puede elevar vulnerabilidades CRITICAL
  a nivel de alerta por correo.
  ========================================================================
  -->

  <vulnerability-detection>

    <enabled>yes</enabled>

    <index-status>yes</index-status>

    <!--
    Actualizacion del feed cada hora.
    -->
    <feed-update-interval>60m</feed-update-interval>

  </vulnerability-detection>


  <!--
  ========================================================================
  11. INDEXER
  ========================================================================
  -->

  <indexer>

    <enabled>yes</enabled>

    <hosts>

      <host>https://127.0.0.1:9200</host>

    </hosts>

    <ssl>

      <certificate_authorities>

        <ca>/etc/filebeat/certs/root-ca.pem</ca>

      </certificate_authorities>

      <certificate>
        /etc/filebeat/certs/wazuh-server.pem
      </certificate>

      <key>
        /etc/filebeat/certs/wazuh-server-key.pem
      </key>

    </ssl>

  </indexer>


  <!--
  ========================================================================
  12. FILE INTEGRITY MONITORING - FIM
  ========================================================================

  IMPORTANTE:

  El FIM general y las rutas especificas de agentes se configuran
  principalmente mediante:

      /var/ossec/etc/shared/*/agent.conf

  Aqui mantenemos solamente el comportamiento global.

  Las reglas personalizadas interpretan los eventos producidos por FIM.

  ========================================================================
  -->

  <syscheck>

    <disabled>no</disabled>

    <!--
    Analisis completo dos veces al dia.
    -->
    <frequency>43200</frequency>

    <scan_on_start>yes</scan_on_start>

    <!--
    Generar alertas cuando aparezcan archivos nuevos en rutas vigiladas.
    -->
    <alert_new_files>yes</alert_new_files>

    <!--
    No ignorar automaticamente modificaciones repetitivas.
    Queremos conservar visibilidad en archivos criticos.
    -->
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>


    <!--
    --------------------------------------------------------------------
    EXCLUSIONES DE ARCHIVOS DINAMICOS DEL SISTEMA
    --------------------------------------------------------------------
    -->

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <!--
    No generar eventos por archivos de log ni swap de editores.
    -->
    <ignore type="sregex">.log$|.swp$</ignore>


    <!--
    Nunca enviar diferencias de este archivo.

    Puede contener material altamente sensible.
    -->
    <nodiff>/etc/ssl/private.key</nodiff>


    <!--
    Evitar recorrer pseudo-filesystems.
    -->
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>


    <!--
    Prioridad del proceso FIM.

    10 = menor prioridad que procesos normales.
    -->
    <process_priority>10</process_priority>


    <!--
    Limite global de eventos generados por FIM.
    -->
    <max_eps>50</max_eps>


    <!--
    Sincronizacion del estado FIM.
    -->
    <synchronization>

      <enabled>yes</enabled>

      <interval>5m</interval>

      <max_eps>10</max_eps>

    </synchronization>

  </syscheck>


  <!--
  ========================================================================
  13. ACTIVE RESPONSE - COMANDOS NATIVOS
  ========================================================================

  Aqui declaramos los comandos.

  Las reglas que los ejecutan se encuentran en las reglas personalizadas.

  No todas las detecciones tendran Active Response.

  Especialmente:

      Malware
      Rootkit
      Persistencia local
      Cambios de archivos

  no se bloquearan automaticamente con firewall-drop porque pueden no
  contener una IP de origen.

  ========================================================================
  -->


  <!--
  --------------------------------------------------------------------
  Deshabilitar una cuenta comprometida.
  --------------------------------------------------------------------
  -->

  <command>

    <name>disable-account</name>

    <executable>disable-account</executable>

    <timeout_allowed>yes</timeout_allowed>

  </command>


  <!--
  --------------------------------------------------------------------
  Reinicio controlado de Wazuh.
  --------------------------------------------------------------------
  -->

  <command>

    <name>restart-wazuh</name>

    <executable>restart-wazuh</executable>

  </command>


  <!--
  --------------------------------------------------------------------
  Bloqueo temporal de IP mediante firewall.
  --------------------------------------------------------------------

  Solo se utilizara cuando la alerta contenga una srcip valida.

  NO se utilizara para detecciones puramente locales de malware/rootkit.
  --------------------------------------------------------------------
  -->

  <command>

    <name>firewall-drop</name>

    <executable>firewall-drop</executable>

    <timeout_allowed>yes</timeout_allowed>

    <expect>srcip</expect>

  </command>


  <!--
  --------------------------------------------------------------------
  host-deny
  --------------------------------------------------------------------
  -->

  <command>

    <name>host-deny</name>

    <executable>host-deny</executable>

    <timeout_allowed>yes</timeout_allowed>

    <expect>srcip</expect>

  </command>


  <!--
  --------------------------------------------------------------------
  route-null
  --------------------------------------------------------------------
  -->

  <command>

    <name>route-null</name>

    <executable>route-null</executable>

    <timeout_allowed>yes</timeout_allowed>

    <expect>srcip</expect>

  </command>


  <!--
  --------------------------------------------------------------------
  Windows route-null
  --------------------------------------------------------------------
  -->

  <command>

    <name>win_route-null</name>

    <executable>route-null.exe</executable>

    <timeout_allowed>yes</timeout_allowed>

    <expect>srcip</expect>

  </command>


  <!--
  --------------------------------------------------------------------
  Windows netsh
  --------------------------------------------------------------------
  -->

  <command>

    <name>netsh</name>

    <executable>netsh.exe</executable>

    <timeout_allowed>yes</timeout_allowed>

    <expect>srcip</expect>

  </command>


  <!--
  ========================================================================
  14. ACTIVE RESPONSE - SSH BRUTE FORCE
  ========================================================================

  Regla nativa:
      5720

  La regla 5720 detecta una rafaga de fallos de autenticacion SSH
  y realiza la correlacion por IP de origen.

  No bloqueamos por un unico fallo.

  Bloqueo temporal:
      180 segundos
  ========================================================================
  -->

  <active-response>

    <disabled>no</disabled>

    <command>firewall-drop</command>

    <location>local</location>

    <rules_id>5720</rules_id>

    <timeout>180</timeout>

  </active-response>


  <!--
  ========================================================================
  15. ACTIVE RESPONSE - SSH BRUTE FORCE EXITOSO
  ========================================================================

  Regla OrangeBox:
      10006

  Detecta:

      brute force SSH (5720)
              +
      autenticacion SSH exitosa (5715)

  La regla 5720 ya realiza la correlacion por IP de origen.

  Esto se considera una posible intrusión exitosa.

  Bloqueo:
      24 horas
  ========================================================================
  -->

  <active-response>

    <disabled>no</disabled>

    <command>firewall-drop</command>

    <location>local</location>

    <rules_id>10006</rules_id>

    <timeout>86400</timeout>

  </active-response>


  <!--
  ========================================================================
  16. ACTIVE RESPONSE - WEB SENSITIVE FILE DISCOVERY
  ========================================================================

  Regla OrangeBox:
      10026

  Detecta multiples intentos de acceso desde la misma IP a archivos
  sensibles o rutas de credenciales mediante el servidor web.

  Ejemplos:

      /.env
      /.aws/credentials
      /.config/gcloud/application_default_credentials.json
      /.oci/config
      /wp-config.php
      /@fs/.../.aws/credentials
      /@fs/.../.openai/config.json

  Estos eventos representan reconocimiento automatizado de secretos o
  archivos sensibles y no deben clasificarse como fuerza bruta HTTP.

  La regla 10026 es de alta severidad y contiene una srcip valida, por
  lo que se aplica firewall-drop.

  Bloqueo:
      24 horas

  IMPORTANTE:

      No se utiliza whitelist para crawlers o User-Agent.
      El User-Agent HTTP puede falsificarse facilmente.

  ========================================================================
  -->

  <active-response>

    <disabled>no</disabled>

    <command>firewall-drop</command>

    <location>local</location>

    <rules_id>10026</rules_id>

    <timeout>86400</timeout>

  </active-response>


  <!--
  ========================================================================
  17. COMANDO: df
  ========================================================================
  -->

  <localfile>

    <log_format>command</log_format>

    <command>df -P</command>

    <frequency>360</frequency>

  </localfile>


  <!--
  ========================================================================
  18. PUERTOS ESCUCHANDO
  ========================================================================
  -->

  <localfile>

    <log_format>full_command</log_format>

    <command>netstat -tulpn | sed 's/\([[:alnum:]\]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/\[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>

    <alias>netstat listening ports</alias>

    <frequency>360</frequency>

  </localfile>


  <!--
  ========================================================================
  19. ULTIMOS LOGINS
  ========================================================================
  -->

  <localfile>

    <log_format>full_command</log_format>

    <command>last -n 20</command>

    <frequency>360</frequency>

  </localfile>


  <!--
  ========================================================================
  20. RULESET NATIVO + PERSONALIZADO
  ========================================================================

  Wazuh carga:

      - Decoders oficiales
      - Rules oficiales
      - Decoders personalizados
      - Rules personalizadas

  No excluimos reglas oficiales de Wazuh.
  ========================================================================
  -->

  <ruleset>

    <decoder_dir>ruleset/decoders</decoder_dir>

    <rule_dir>ruleset/rules</rule_dir>

    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>


    <!--
    Decoders personalizados.
    -->
    <decoder_dir>etc/decoders</decoder_dir>


    <!--
    Todas nuestras reglas personalizadas.
    -->
    <rule_dir>etc/rules</rule_dir>

  </ruleset>


  <!--
  ========================================================================
  21. RULE TEST
  ========================================================================

  Permite utilizar wazuh-logtest para probar las reglas.

  Es especialmente importante mientras construimos el nuevo ruleset.
  ========================================================================
  -->

  <rule_test>

    <enabled>yes</enabled>

    <threads>1</threads>

    <max_sessions>64</max_sessions>

    <session_timeout>15m</session_timeout>

  </rule_test>


  <!--
  ========================================================================
  22. AUTHD - REGISTRO DE AGENTES
  ========================================================================
  -->

  <auth>

    <disabled>no</disabled>

    <port>1515</port>


    <!--
    No confiar automaticamente en la IP de origen para identificar
    un agente.

    Esto es importante en redes WAN/NAT.
    -->
    <use_source_ip>no</use_source_ip>


    <!--
    Permite reutilizar IDs antiguos de agentes eliminados.
    -->
    <purge>yes</purge>


    <!--
    Exige password definida en authd.pass para registrar agentes.
    -->
    <use_password>yes</use_password>


    <!--
    Suites criptograficas permitidas.

    NOTA:
    Esto NO significa por si solo "TLS 1.3 exclusivamente".

    La compatibilidad exacta depende de la version de Wazuh/OpenSSL.
    Por eso no hacemos una promesa falsa en el comentario.
    -->
    <ciphers>ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384</ciphers>


    <!--
    No verificamos hostname del certificado actualmente.

    Esto se revisara posteriormente junto con la PKI real de los agentes.
    -->
    <ssl_verify_host>no</ssl_verify_host>


    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>


    <!--
    Mantener negociacion explicita segun las capacidades actuales.

    NO se etiqueta como "TLS 1.3 obligatorio".
    -->
    <ssl_auto_negotiate>no</ssl_auto_negotiate>

  </auth>


  <!--
  ========================================================================
  23. CLUSTER
  ========================================================================

  Actualmente no utilizamos cluster.

  Se mantiene deshabilitado para evitar componentes innecesarios.
  ========================================================================
  -->

  <cluster>

    <name>wazuh</name>

    <node_name>node01</node_name>

    <node_type>master</node_type>

    <key></key>

    <port>1516</port>

    <bind_addr>0.0.0.0</bind_addr>

    <nodes>

      <node>NODE_IP</node>

    </nodes>

    <hidden>no</hidden>

    <disabled>yes</disabled>

  </cluster>


</ossec_config>


<!--
========================================================================
SEGUNDA SECCION DE CONFIGURACION
========================================================================

Aqui colocamos las fuentes de eventos locales del propio Wazuh Manager.

No se mezclan con la configuracion anterior para mantener el archivo
facil de leer.
========================================================================
-->

<ossec_config>


  <!--
  ========================================================================
  24. SYSTEMD JOURNAL
  ========================================================================
  -->

  <localfile>

    <log_format>journald</log_format>

    <location>journald</location>

  </localfile>


  <!--
  ========================================================================
  25. AUDITD
  ========================================================================

  Auditd aporta informacion adicional sobre:

      - Ejecucion de comandos
      - Cambios de identidad
      - sudo
      - cambios de archivos
      - acciones administrativas

  Esto complementa FIM.
  ========================================================================
  -->

  <localfile>

    <log_format>audit</log_format>

    <location>/var/log/audit/audit.log</location>

  </localfile>


  <!--
  ========================================================================
  26. ACTIVE RESPONSE LOG
  ========================================================================

  Permite que las acciones realizadas por Active Response sean tambien
  visibles para Wazuh.
  ========================================================================
  -->

  <localfile>

    <log_format>syslog</log_format>

    <location>/var/ossec/logs/active-responses.log</location>

  </localfile>


  <!--
  ========================================================================
  27. EMAIL HTML ORANGEBOX
  ========================================================================

  Esta es la ruta principal de envio de alertas de seguridad.

  El script recibe:

      - JSON de la alerta
      - nivel
      - regla
      - agente
      - IP origen
      - descripcion
      - decoder
      - datos adicionales

  y genera el correo HTML.

  Nivel 12 significa:

      Cualquier alerta personalizada de nivel 12 o superior.

  Nuestras alertas criticas normalmente seran nivel 12/13.
  ========================================================================
  -->

