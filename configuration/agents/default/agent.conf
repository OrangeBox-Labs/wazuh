<agent_config>
  <syscheck>

    <!-- ACTIVAR GENERACIÓN DE ALERTAS ANTE ARCHIVOS NUEVOS EN LOS AGENTES -->
    <alert_new_files>yes</alert_new_files>
    
    <!-- CATEGORÍA 1: ZONAS TEMPORALES GLOBALES (Inyección de WebShells y Malware) -->
    <directories realtime="yes">/dev/shm</directories>
    <directories realtime="yes">/tmp</directories>
    <directories realtime="yes">/var/tmp</directories>

    <!-- Zimbra -->
    <directories realtime="yes">/opt/zimbra/data/tmp</directories>

    <!-- Carbonio CE -->
    <directories realtime="yes">/opt/zextras/data/tmp</directories>

    <!-- CATEGORÍA 2: PERFILES DE USUARIOS (Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/root</directories>


    <!-- CATEGORÍA 3: ACCESOS, IDENTIDADES Y ELEVACIÓN DE PRIVILEGIOS (Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/etc/ssh,/etc/sshd</directories>
    <directories realtime="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d,/etc/sudoers.conf</directories>
    <directories realtime="yes" report_changes="yes">/etc/pam.d</directories>
    <directories realtime="yes" report_changes="yes">/etc/polkit-1</directories>
    <directories realtime="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/gshadow</directories>
    <directories realtime="yes" report_changes="yes">/etc/securetty,/etc/security/limits.conf</directories>

    <!--
        CATEGORÍA 3B: BINARIOS AUTORIZADOS PARA SUDO -> ROOT

        Estos son exactamente los comandos incluidos en la whitelist de
        orangebox-auth.xml para Zimbra.

        Se monitorean COMO ARCHIVOS INDIVIDUALES y con report_changes=yes.
        Esto permite detectar no solamente reemplazos/eliminaciones, sino
        también cambios de contenido mediante el evento FIM 550.

        La integridad de estos binarios es crítica: un atacante podría
        modificar un comando legítimo de la whitelist para convertirlo en
        una vía de escalamiento que seguiría siendo considerada autorizada.

        IMPORTANTE:
            No se monitorea todo /opt/zimbra/libexec ni todo
            /opt/zimbra/common/sbin para evitar ruido innecesario.
            Solamente se protegen los ejecutables que actualmente forman
            parte de la whitelist sudo -> root.
    -->
    <directories realtime="yes" report_changes="yes">/opt/zimbra/libexec/zmstat-fd</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/postfix</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/postalias</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/qshape.pl</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/postconf</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/postsuper</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/common/sbin/postcat</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/libexec/zmqstat</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/libexec/zmmtastatus</directories>
    <directories realtime="yes" report_changes="yes">/opt/zimbra/libexec/zmmailboxdmgr</directories>


    <!-- CATEGORÍA 4: ENTORNO DE RED Y COMPORTAMIENTO BASE (Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/etc/resolv.conf,/etc/hosts,/etc/nsswitch.conf</directories>
    <directories realtime="yes" report_changes="yes">/etc/fstab,/etc/sysconfig</directories>
    <directories realtime="yes" report_changes="yes">/etc/update-motd.d,/etc/motd</directories>


    <!-- CATEGORÍA 5: SEGURIDAD, CORTAFUEGOS Y ANATIVIRUS (Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/etc/shorewall,/etc/firewalld,/etc/ufw,/etc/csf,/etc/sysconfig/iptables,/etc/sysconfig/iptables.save,/etc/sysconfig/iptables-config,/etc/sysconfig/nftables,/etc/sysconfig/nftables.conf,/etc/nftables.conf,/etc/imunify360,/etc/sysconfig/imunify360</directories>


    <!-- CATEGORÍA 6: SERVIDORES WEB, PANELES DE CONTROL Y PHP (Acotado sin enlaces a LOGS - Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/etc/httpd/conf,/etc/httpd/conf.d,/etc/httpd/conf.modules.d</directories>
    <directories realtime="yes" report_changes="yes">/etc/nginx,/etc/apache2</directories>
    <directories realtime="yes" report_changes="yes">/etc/cpanel</directories>
    <directories realtime="yes" report_changes="yes">/etc/php.ini,/etc/php.d,/etc/php-fpm.conf,/etc/php-fpm.d</directories>


    <!-- CATEGORÍA 7: BASES DE DATOS Y LENGUAJES (MySQL, MariaDB, PostgreSQL - Monitoreo con DIFF Activo) -->
    <directories realtime="yes" report_changes="yes">/etc/my.cnf,/etc/my.cnf.d</directories>
    <directories realtime="yes" report_changes="yes">/etc/mysql,/var/lib/pgsql/data/*.conf</directories>


    <!-- CATEGORÍA 8: PERSISTENCIA Y AUTOMATIZACIÓN (Estructuras de Servicios y Crons) -->
    <directories realtime="yes" report_changes="yes">/etc/systemd/system,/etc/systemd/user</directories>
    <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/crontab,/etc/anacrontab</directories>
    <directories realtime="yes">/var/spool/cron,/var/spool/anacron</directories>
    <directories realtime="yes" report_changes="yes">/etc/modules,/etc/modules-load.d</directories>
    <directories realtime="yes" report_changes="yes">/etc/inetd.conf,/etc/xinetd.d</directories>


    <!-- CATEGORÍA 9: BINARIOS Y LIBRERÍAS (Archivos compilados que NO requieren DIFF para ahorrar espacio) -->
    <directories realtime="yes">/usr/local/bin,/usr/local/sbin</directories>
    <directories realtime="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>
    <directories realtime="yes">/etc/ld.so.conf.d</directories>
    <directories realtime="yes">/lib,/lib64,/usr/lib,/usr/lib64</directories>
    <directories realtime="yes">/etc/ssl/certs,/etc/pki/tls</directories>

  </syscheck>
</agent_config>
